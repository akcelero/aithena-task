name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check lockfile is in sync
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --group test

      - name: Lint with ruff
        run: uv run --locked --group test ruff check src tests

      - name: Run tests
        run: uv run --locked --group test pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test image (test stage)
        run: docker build --target test -t aithena:test .

      - name: Build runtime image
        run: docker build --target runtime -t aithena:ci .

      # CD: push aithena:ci to a registry here, once there is a deploy target.
