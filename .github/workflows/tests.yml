name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check lockfile is in sync
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --group test

      - name: Lint with ruff
        run: uv run --locked --group test ruff check src tests

      - name: Run tests
        run: uv run --locked --group test pytest
